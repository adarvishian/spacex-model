name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra service

      - name: Verify test collection floor
        run: |
          COUNT=$(uv run pytest --collect-only -q 2>&1 | tail -1 | awk '{print $1}')
          echo "Collected ${COUNT} tests"
          MIN_TESTS=750
          if [ "${COUNT}" -lt "${MIN_TESTS}" ]; then
            echo "Expected at least ${MIN_TESTS} collected tests (got ${COUNT})"
            exit 1
          fi

      - name: Ruff
        run: uv run ruff check src tests

      - name: Black
        run: uv run black --check src tests

      - name: Mypy
        run: uv run mypy

      - name: US English spell-check
        run: |
          if rg -i 'modelling|modelled|behaviour|optimisation|optimised|colour|organisation|programme|centre|labelled|catalogue|recognise|defence|licence' \
            --glob '*.py' --glob '*.md' --glob '*.yaml' --glob '*.yml' --glob '*.json' \
            src tests docs; then
            echo "British spelling detected"
            exit 1
          fi

      - name: Audit artifact drift check
        run: uv run spacex-audit --check

      - name: Precache artifact freshness (Milestone 0.3)
        run: uv run python scripts/check_precache_artifacts.py

      - name: pip-audit (dependency security)
        run: uv run pip-audit

      - name: Pytest (excludes slow hypothesis by default)
        run: uv run pytest -n auto -m "not slow" --cov=spacex_model --cov-report=term-missing:skip-covered --cov-report=xml --tb=short -q

      - name: Serverless smoke (Milestone 1.4)
        run: uv run pytest tests/service/test_serverless_smoke.py -m slow --tb=short -q

      - name: Prebuild skip probe (Milestone 1.2)
        run: uv run pytest tests/scripts/test_precache_skip.py --tb=short -q

      - name: Record coverage baseline
        run: |
          uv run python -c "
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse('coverage.xml').getroot()
          rate = float(root.attrib.get('line-rate', 0)) * 100
          print(f'Total line coverage: {rate:.1f}%')
          Path('docs/coverage_baseline.txt').write_text(f'{rate:.1f}\n')
          "

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            docs/coverage_baseline.txt

      - name: Hypothesis invariant suite (PRD §10.9)
        env:
          HYPOTHESIS_MAX_EXAMPLES: "200"
          HYPOTHESIS_DEADLINE_MS: "10000"
        run: uv run pytest tests/invariant/ -m slow --tb=short -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Python package (precompute base case)
        run: uv sync --frozen --extra dev --extra service

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit (high severity)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Vitest unit tests (shared logic)
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        env:
          # Full 2,000-trial MC precache at deploy; smoke count in CI to stay within job budget.
          SPACEX_MODEL_MC_PRECOMPUTE_TRIALS: "64"
        run: npm run build

      - name: Frontend bundle budget (FRONTEND_PRD §8.3)
        working-directory: frontend
        run: npm run check:bundle

      - name: Design token lint (FRONTEND_UX_PRD A6)
        working-directory: frontend
        run: npm run check:tokens

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Playwright acceptance (FRONTEND_PRD A1–A10)
        working-directory: frontend
        env:
          CI: "true"
          E2E_LOAD_MAX_MS: "12000"
        run: npm run test:e2e
